{% extends 'dashboard/panel/base_panel.html' %}
{% load i18n %}
{% block panel_content %}
<div class="panel-header">
    <div>
        <span class="eyebrow">{% trans "Confirm deletion" %}</span>
        <h1>{{ page_title }}</h1>
    </div>
</div>
<div class="content-card">
    <p>{% blocktrans with label=object_label %}Are you sure you want to delete <strong>{{ label }}</strong>?{% endblocktrans %}</p>
    <form method="post" class="inline-actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">{% trans "Delete" %}</button>
        <a href="{% url cancel_url %}" class="btn btn-ghost">{% trans "Cancel" %}</a>
    </form>
</div>
{% endblock %}
