{% extends 'dashboard/panel/base_panel.html' %}
{% load i18n %}
{% block panel_content %}
<div class="panel-header"><div><span class="eyebrow">{% trans "Question management" %}</span><h1>{{ page_title }}</h1></div></div>
<div class="content-card">
    <form method="post" class="panel-form">
        {% csrf_token %}
        <div class="form-grid">
            {% for field in form %}
                <div class="form-field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="form-error">{{ field.errors|striptags }}</div>{% endif %}
                </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary">{% trans "Save question" %}</button>
    </form>
</div>
{% endblock %}
